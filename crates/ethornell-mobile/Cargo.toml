[package]
name = "ethornell-mobile"
version = "0.1.0"
edition.workspace = true
license.workspace = true
build = "build.rs"

# The host-driven C ABI of the mobile launchers: `libethornell_mobile.so` for the
# Android app (platform/android) and `libethornell_mobile.a` for the iOS app
# (platform/ios). See platform/android/include and platform/ios/include.
[lib]
name = "ethornell_mobile"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
ethornell-app = { path = "../ethornell-app", default-features = false, features = ["host-driven"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
ndk-context = "0.1"
jni = "0.21"
